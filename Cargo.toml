[package]
name = "rekyll"
version = "0.1.0"
edition = "2021"
description = "Jekyll, but make it Rust"
license = "MIT"

[features]
# The preview server is built in by default; --no-default-features gives a
# build-only binary without the HTTP crates.
default = ["serve"]
serve = ["dep:tiny_http", "dep:mime_guess"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "alloc"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
globset = "0.4.20"
grass = { version = "0.13.4", default-features = false, features = ["random"] }
html-escape = "0.2.15"
indexmap = "2.14.2"
liquid = "0.26"
liquid-core = "0.26"
mime_guess = { version = "2.0.5", optional = true }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
strftime-ruby = { version = "1.3.2", default-features = false, features = ["std", "alloc"] }
tiny_http = { version = "0.12.0", optional = true }
walkdir = "2"
yaml-rust2 = "0.12"

[profile.release]
opt-level = 3
# A single self-contained executable: no Ruby, no gems, nothing to install
# alongside it.
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
liquid-core = { path = "vendor/liquid-core" }
