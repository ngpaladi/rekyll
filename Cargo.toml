[package]
name = "rekyll"
version = "0.1.0"
edition = "2021"
description = "Jekyll, but make it Rust"
license = "MIT"
authors = ["Noah Paladino <ngpaladi@gmail.com>"]
repository = "https://github.com/ngpaladi/rekyll"
readme = "README.md"

[features]
# The preview server is built in by default; --no-default-features gives a
# build-only binary without the HTTP crates.
default = ["serve"]
serve = ["dep:tiny_http", "dep:mime_guess"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "alloc"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
globset = "0.4.20"
grass = { version = "0.13.4", default-features = false, features = ["random"] }
html-escape = "0.2.15"
indexmap = "2.14.2"
liquid = "0.26"
liquid-core = "0.26"
mime_guess = { version = "2.0.5", optional = true }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
strftime-ruby = { version = "1.3.2", default-features = false, features = ["std", "alloc"] }
tiny_http = { version = "0.12.0", optional = true }
walkdir = "2"
yaml-rust2 = "0.12"

[profile.release]
opt-level = 3
# A single self-contained executable: no Ruby, no gems, nothing to install
# alongside it.
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
liquid-core = { path = "vendor/liquid-core" }

# Packaging (`cargo deb`, `cargo generate-rpm`). Both take the static musl
# binary, so the packages have no library dependencies; see
# .github/workflows/release.yml.
[package.metadata.deb]
maintainer = "Noah Paladino <ngpaladi@gmail.com>"
extended-description = """\
A from-scratch reimplementation of the Jekyll static site generator that \
produces byte-identical output from identical input. One binary; no Ruby."""
section = "web"
priority = "optional"
depends = ""
assets = [
    ["target/release/rekyll", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rekyll/", "644"],
    ["THIRD_PARTY_LICENSES.md", "usr/share/doc/rekyll/", "644"],
]

[package.metadata.generate-rpm]
summary = "Jekyll, but make it Rust"
assets = [
    { source = "target/release/rekyll", dest = "/usr/bin/rekyll", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/rekyll/LICENSE", mode = "644", doc = true },
    { source = "THIRD_PARTY_LICENSES.md", dest = "/usr/share/licenses/rekyll/THIRD_PARTY_LICENSES.md", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/rekyll/README.md", mode = "644", doc = true },
]
